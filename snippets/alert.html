<div class="ecco-alert" role="status">
  <span class="ecco-alert-icon" aria-hidden="true">i</span>
  <div class="ecco-alert-body">
    <strong>Heads up</strong>
    <p>Link Ecco CSS first, then Ecco UI. Tokens stay in sync automatically.</p>
  </div>
</div>

<div class="ecco-alert ecco-alert--success" role="status">
  <span class="ecco-alert-icon" aria-hidden="true">✓</span>
  <div class="ecco-alert-body">
    <strong>Saved</strong>
    <p>Your changes are live.</p>
  </div>
</div>

<div class="ecco-alert ecco-alert--warning" role="status">
  <span class="ecco-alert-icon" aria-hidden="true">!</span>
  <div class="ecco-alert-body">
    <strong>Check your CDN pin</strong>
    <p>Prefer a version tag over <code>@main</code> in production.</p>
  </div>
</div>

<div class="ecco-alert ecco-alert--danger" role="alert">
  <span class="ecco-alert-icon" aria-hidden="true">!</span>
  <div class="ecco-alert-body">
    <strong>Could not publish</strong>
    <p>Fix the form errors and try again.</p>
  </div>
  <button type="button" class="ecco-alert-close" aria-label="Dismiss">×</button>
</div>
